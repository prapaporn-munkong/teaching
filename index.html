<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบรายงานและติดตามการเข้าสอน | วิทยาลัยนาฏศิลปลพบุรี</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{font-family:Sarabun,sans-serif;color:#132642;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#2459af}.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.aside{background:#102a4c;color:white;padding:24px 14px}.brand{font-size:19px;font-weight:700;padding:10px 13px 24px}.brand small{display:block;font-weight:400;font-size:12px;color:#c7d8ec}.nav{display:block;border:0;background:none;color:#d8e7f9;text-align:left;padding:13px 15px;border-radius:9px;width:100%;margin-bottom:4px}.nav:hover,.nav.active{background:#254d7c;color:white}.main{min-width:0}.top{padding:21px 27px;background:white;border-bottom:1px solid #e4e9f0;display:flex;justify-content:space-between;gap:10px;align-items:center}.content{padding:26px;max-width:1550px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{border:1px solid #e3e9f2;border-radius:14px;background:#fff;padding:18px;box-shadow:0 2px 9px #102a4c06}.card span{color:#63748c;font-size:13px}.card b{display:block;font-size:27px;margin-top:6px;color:#12345d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{margin-top:18px}.panel h3{margin:0 0 14px;font-size:17px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px;align-items:end}.controls label{font-size:12px;color:#54657f;display:grid;gap:3px}select,input,textarea{background:white;border:1px solid #cbd5e2;border-radius:8px;padding:9px 10px;min-width:120px;color:#1a2c47}input[type=date]{min-width:145px}.btn{background:#153f74;color:white;border:0;border-radius:8px;padding:9px 13px}.btn:disabled{background:#aab6c4;cursor:default}.btn.alt{background:#eaf0fa;color:#173c6c}.btn.danger{background:#a53939}.muted{color:#687991;font-size:13px}.notice{padding:10px 13px;border-radius:8px;background:#fff3d4;color:#77550a;margin-bottom:16px}.pill{border-radius:999px;display:inline-block;font-size:12px;padding:4px 10px;background:#e8edf5;color:#495a75}.taught{background:#dff5e9;color:#12683d}.partial{background:#fff0cb;color:#915f06}.absent{background:#fee4e4;color:#a22d32}.cancel{background:#e9eaf2;color:#5d6079}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px;border-bottom:1px solid #e8edf3;text-align:left;white-space:nowrap}th{color:#5b708c;font-size:12px}td small{display:block;color:#72809a}dialog{border:0;border-radius:15px;padding:24px;box-shadow:0 20px 70px #162d4560;max-width:480px;width:94%}dialog::backdrop{background:#0c213c91}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:600;font-size:13px}.field input,.field textarea,.field select{width:100%}.bar{height:18px;border-radius:4px;background:#e5edfa;overflow:hidden;margin-bottom:12px}.fill{height:100%;background:#1b669b}.rowflex{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:720px){.shell{display:block}.aside{padding:12px}.brand{padding:5px}.menu{display:flex;overflow-x:auto;gap:5px}.nav{min-width:120px}.top{padding:14px}.content{padding:13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:12px}.card b{font-size:21px}}
</style></head><body><div class="shell"><aside class="aside"><div class="brand">🎭 ระบบติดตามการเข้าสอน<small>วิทยาลัยนาฏศิลปลพบุรี</small></div><div class="menu" id="menu"></div></aside><div class="main"><div class="top"><div><b id="pageTitle">ตารางสอนของฉัน</b><div class="muted" id="subtitle">ระบบรายงานและติดตามการเข้าสอนของครูและอาจารย์</div></div><div class="rowflex"><span id="who" class="muted"></span><button class="btn alt" id="logout" hidden>ออกจากระบบ</button></div></div><main class="content"><div id="warning" class="notice">โปรดกำหนดค่า Supabase เพื่อเชื่อมต่อฐานข้อมูลกลาง</div><div id="app"></div></main></div></div>
<dialog id="loginDialog"><h2>เข้าสู่ระบบ</h2><p class="muted">บัญชีผู้ใช้ต้องได้รับการสร้างโดยผู้ดูแลระบบ</p><form id="loginForm"><div class="field"><label>อีเมล</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>รหัสผ่าน</label><input id="password" type="password" required autocomplete="current-password"></div><div class="rowflex"><button class="btn" type="submit">เข้าสู่ระบบ</button></div><p id="loginError" role="alert" style="color:#a53939"></p></form></dialog>
<dialog id="confirmDialog"><h3>ยืนยันการเข้าสอน</h3><p class="muted" id="modalCourse"></p><form id="confirmForm"><div class="field"><label>สถานะ</label><select id="attStatus"><option value="taught">เข้าสอนครบตามตาราง</option><option value="partial">เข้าสอนบางส่วน</option></select></div><div class="field"><label>เวลาเริ่มจริง</label><input id="actualStart" type="datetime-local" required></div><div class="field"><label>เวลาสิ้นสุดจริง</label><input id="actualEnd" type="datetime-local" required></div><div class="field"><label>หัวข้อที่สอน</label><textarea id="topic" rows="2"></textarea></div><div class="field"><label>หมายเหตุ</label><textarea id="notes" rows="2"></textarea></div><div class="rowflex"><button type="button" class="btn alt" id="closeModal">ยกเลิก</button><button type="submit" class="btn">บันทึกการยืนยัน</button></div><p id="confirmError" role="alert" style="color:#a53939"></p></form></dialog>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const CFG={url:'__SUPABASE_URL__',key:'__SUPABASE_PUBLISHABLE_KEY__'};
const configured=CFG.url.startsWith('https://')&&!CFG.url.includes('__')&&!CFG.key.includes('__');
const supabase=configured?createClient(CFG.url,CFG.key):null;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLocal=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const timeLocal=d=>{const x=new Date(d);return `${dateLocal(d)}T${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`};
const fmt=d=>new Date(d).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
const mins=(a,b)=>Math.max(0,Math.floor((new Date(b)-new Date(a))/60000));
let user=null,profile=null,rows=[],page='mine',selected=null,refreshTimer=null;
let filters={date:dateLocal(new Date()),level:'all',term:'all',search:''};
const menus=[['mine','📅 ตารางสอนของฉัน'],['dashboard','📊 Dashboard ผู้บริหาร'],['schedules','🗓️ ตารางสอนทั้งหมด'],['reports','📄 รายงานแยกระดับ'],['audit','🛡️ ประวัติการยืนยัน']];
function statusOf(r){if(r.cancelled)return ['ยกเลิก/เปลี่ยนแปลง','cancel'];if(r.attendance_records?.length){let s=r.attendance_records[0].status;return s==='taught'?['เข้าสอนแล้ว','taught']:s==='partial'?['เข้าสอนบางส่วน','partial']:['ไม่เข้าสอน (ยืนยัน)','absent']}return new Date(r.scheduled_start)>new Date()?['รอถึงเวลาเรียน','']:['ยังไม่บันทึกการเข้าสอน','partial']}
function canSeeAdmin(){return ['admin','reviewer'].includes(profile?.role)}
function flatten(r){const course=r.courses||{},group=r.class_groups||{};return {...r,course,group,at:r.attendance_records?.[0]||null,teachers:(r.schedule_teachers||[]).map(t=>t.profiles?.full_name||'ไม่ระบุ'),levelId:course.level_id}}
function filtered(){return rows.filter(r=>(filters.level==='all'||String(r.levelId)===filters.level)&&(filters.term==='all'||r.academic_terms?.id===filters.term)&&(!filters.search||`${r.course.name} ${r.course.code} ${r.group.name} ${r.teachers.join(' ')}`.toLowerCase().includes(filters.search.toLowerCase())))}
function controls(useDate=false){const termOptions=[...new Map(rows.filter(r=>r.academic_terms).map(r=>[r.academic_terms.id,r.academic_terms])).values()];return `<div class="controls">${useDate?`<label>วันที่<input id="dateFilter" type="date" value="${esc(filters.date)}"></label>`:''}<label>ระดับการศึกษา<select id="levelFilter"><option value="all">ทุกระดับ</option>${[[1,'ม.ต้น'],[2,'ปวช.'],[3,'ปริญญาตรี']].map(([v,n])=>`<option value="${v}" ${filters.level===String(v)?'selected':''}>${n}</option>`).join('')}</select></label><label>ภาคเรียน<select id="termFilter"><option value="all">ทุกภาคเรียน</option>${termOptions.map(t=>`<option value="${t.id}" ${filters.term===t.id?'selected':''}>${t.academic_year}/${t.term}</option>`).join('')}</select></label><label>ค้นหา<input id="searchFilter" placeholder="ชื่อวิชา / ผู้สอน" value="${esc(filters.search)}"></label></div>`}
function bindFilters(){['level','term','search','date'].forEach(k=>{let el=$(k+'Filter');if(el)el.addEventListener(k==='search'?'input':'change',()=>{filters[k]=el.value;render()})})}
function table(data,mine=false){return `<div class="tablewrap"><table><thead><tr><th>วันและเวลา</th><th>รายวิชา / ห้อง</th><th>ผู้สอนร่วม</th><th>ชั่วโมง</th><th>สถานะ</th><th>ผู้ยืนยัน</th><th>ดำเนินการ</th></tr></thead><tbody>${data.map(r=>`<tr><td>${esc(fmt(r.scheduled_start))}<small>ถึง ${esc(new Date(r.scheduled_end).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}))}</small></td><td><b>${esc(r.course.name)}</b><small>${esc(r.course.code)} | ${esc(r.group.name)} | ${esc(r.room||'-')}</small></td><td>${esc(r.teachers.join(', '))}</td><td>${(mins(r.scheduled_start,r.scheduled_end)/60).toFixed(2)}</td><td><span class="pill ${statusOf(r)[1]}">${statusOf(r)[0]}</span></td><td>${esc(r.at?.confirmer?.full_name||'-')}</td><td>${mine&&!r.at&&!r.cancelled&&new Date(r.scheduled_start)<=new Date()?`<button class="btn" data-confirm="${r.id}">ยืนยัน</button>`:r.at?`<button class="btn alt" data-correct="${r.id}">แจ้งแก้ไข</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">ไม่มีข้อมูล</td></tr>'}</tbody></table></div>`}
function stats(data){const schedules=data.filter(r=>!r.cancelled),plan=schedules.reduce((s,r)=>s+mins(r.scheduled_start,r.scheduled_end),0),actual=schedules.reduce((s,r)=>s+(r.at?.actual_minutes||0),0),taught=schedules.filter(r=>r.at?.status==='taught').length,pending=schedules.filter(r=>!r.at&&new Date(r.scheduled_start)<=new Date()).length,absent=schedules.filter(r=>r.at?.status==='absent').length,co=schedules.filter(r=>r.teachers.length>1).length;return {plan,actual,taught,pending,absent,co,rate:plan?Math.round(actual/plan*1000)/10:0}}
function card(name,value){return `<div class="card"><span>${esc(name)}</span><b>${esc(value)}</b></div>`}
function dashboard(){const d=filtered(),s=stats(d),levels=[[1,'มัธยมศึกษาตอนต้น'],[2,'ปวช.'],[3,'ปริญญาตรี']];return `<h2>ภาพรวมการเข้าสอน</h2>${controls()}<div class="cards">${card('รายการสอนทั้งหมด',d.length)}${card('ชั่วโมงตามตาราง',(s.plan/60).toFixed(1))}${card('ชั่วโมงสอนจริงไม่ซ้ำ',(s.actual/60).toFixed(1))}${card('ร้อยละชั่วโมงสอน',s.rate+'%')}${card('เข้าสอนแล้ว',s.taught)}${card('ยังไม่บันทึก',s.pending)}${card('ยืนยันไม่เข้าสอน',s.absent)}${card('รายการผู้สอนร่วม',s.co)}</div><div class="grid2"><section class="panel"><h3>อัตราชั่วโมงสอนแยกตามระดับ</h3>${levels.map(([id,n])=>{let x=stats(d.filter(r=>r.levelId===id));return `<div class="rowflex"><span>${n}</span><b>${x.rate}%</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,x.rate)}%"></div></div>`}).join('')}</section><section class="panel"><h3>หลักเกณฑ์การนับชั่วโมง</h3><p>นับชั่วโมงรวมตามรายการตารางสอนหนึ่งครั้ง แม้มีครูร่วมหลายคน</p><p class="muted">รายงานภาระงานรายบุคคลควรใช้ค่าจาก schedule_teachers.workload_minutes แยกต่างหาก</p></section></div><section class="panel"><h3>รายการเข้าสอนล่าสุด</h3>${table(d.slice().sort((a,b)=>new Date(b.scheduled_start)-new Date(a.scheduled_start)).slice(0,25))}</section>`}
function mine(){const d=filtered().filter(r=>r.schedule_teachers?.some(x=>x.teacher_id===user.id)&&dateLocal(r.scheduled_start)===filters.date);return `<h2>ตารางสอนของฉัน</h2><p class="muted">เลือกวันที่แล้วกดยืนยันการสอนจากรายการที่ได้รับมอบหมาย</p>${controls(true)}<section class="panel">${table(d,true)}</section>`}
function schedules(){return `<h2>ตารางสอนทั้งหมด</h2>${controls()}<section class="panel">${table(filtered())}</section>`}
function reports(){let d=filtered();return `<h2>รายงานแยกระดับการศึกษา</h2>${controls()}<div class="rowflex"><span class="muted">ส่งออก CSV เปิดใน Excel ได้ (เฉพาะข้อมูลที่บัญชีนี้มีสิทธิ์อ่าน)</span><button id="exportCsv" class="btn alt">ส่งออก CSV</button></div><div class="cards" style="margin-top:14px">${[[1,'มัธยมศึกษาตอนต้น'],[2,'ปวช.'],[3,'ปริญญาตรี']].map(([id,n])=>card(n,stats(d.filter(r=>r.levelId===id)).rate+'%')).join('')}</div><section class="panel">${table(d)}</section>`}
async function audit(){if(!canSeeAdmin()){ $('app').innerHTML='<div class="panel">เฉพาะผู้ตรวจสอบและผู้ดูแลระบบ</div>';return}let {data,error}=await supabase.from('audit_logs').select('occurred_at,action,actor_id,schedule_id').order('occurred_at',{ascending:false}).limit(100);$('app').innerHTML=`<h2>ประวัติการยืนยัน</h2><section class="panel">${error?esc(error.message):`<div class="tablewrap"><table><tr><th>เวลา</th><th>กิจกรรม</th><th>ผู้ดำเนินการ (UUID)</th><th>ตารางสอน</th></tr>${(data||[]).map(x=>`<tr><td>${esc(fmt(x.occurred_at))}</td><td>${esc(x.action)}</td><td>${esc(x.actor_id)}</td><td>${esc(x.schedule_id)}</td></tr>`).join('')}</table></div>`}</section>`}
function render(){if(!user)return;const accessible=menus.filter(([id])=>!['dashboard','schedules','reports','audit'].includes(id)||canSeeAdmin());if(!accessible.some(([id])=>id===page))page='mine';$('menu').innerHTML=accessible.map(([id,label])=>`<button class="nav ${page===id?'active':''}" data-page="${id}">${label}</button>`).join('');$('pageTitle').textContent=menus.find(x=>x[0]===page)?.[1]||'';$('who').textContent=profile?.full_name||user.email;$('app').innerHTML=page==='dashboard'?dashboard():page==='mine'?mine():page==='schedules'?schedules():page==='reports'?reports():'<p>กำลังโหลด…</p>';bindFilters();if(page==='audit')audit();$('menu').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>openConfirm(b.dataset.confirm));document.querySelectorAll('[data-correct]').forEach(b=>b.onclick=()=>requestCorrection(b.dataset.correct));$('exportCsv')?.addEventListener('click',exportCsv)}
async function load(){if(!user)return;const {data:pr,error:pe}=await supabase.from('profiles').select('id,full_name,role,department,active').eq('id',user.id).single();if(pe||!pr?.active){$('warning').textContent='บัญชีนี้ยังไม่มีข้อมูลผู้ใช้หรือไม่ได้รับอนุญาต กรุณาติดต่อผู้ดูแลระบบ';$('loginDialog').close();return}profile=pr;$('warning').classList.add('hidden');const {data,error}=await supabase.from('teaching_schedules').select('id,term_id,scheduled_start,scheduled_end,room,cancelled,academic_terms(id,academic_year,term),courses(code,name,level_id),class_groups(name),schedule_teachers(teacher_id,workload_minutes,profiles(full_name)),attendance_records(id,status,actual_minutes,confirmed_at,confirmed_by,confirmer:profiles!attendance_records_confirmed_by_fkey(full_name))').order('scheduled_start',{ascending:false}).limit(1000);if(error){$('warning').classList.remove('hidden');$('warning').textContent='อ่านข้อมูลไม่สำเร็จ: '+error.message;return}rows=(data||[]).map(flatten);render()}
function openConfirm(id){selected=rows.find(x=>x.id===id);if(!selected)return;$('modalCourse').textContent=selected.course.name+' • '+selected.group.name;$('actualStart').value=timeLocal(selected.scheduled_start);$('actualEnd').value=timeLocal(new Date(Math.min(Date.now(),new Date(selected.scheduled_end).getTime())));$('topic').value='';$('notes').value='';$('confirmError').textContent='';$('confirmDialog').showModal()}
$('closeModal').onclick=()=>$('confirmDialog').close();$('confirmForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;let btn=e.submitter;btn.disabled=true;const {error}=await supabase.rpc('confirm_teaching',{p_schedule:selected.id,p_status:$('attStatus').value,p_actual_start:new Date($('actualStart').value).toISOString(),p_actual_end:new Date($('actualEnd').value).toISOString(),p_topic:$('topic').value,p_notes:$('notes').value});btn.disabled=false;if(error){$('confirmError').textContent=error.message;return}$('confirmDialog').close();await load()};
async function requestCorrection(id){let reason=prompt('ระบุเหตุผลเพื่อส่งคำขอแก้ไขให้ผู้ตรวจสอบ (อย่างน้อย 5 ตัวอักษร)');if(reason===null)return;let {error}=await supabase.rpc('request_attendance_correction',{p_schedule:id,p_reason:reason});alert(error?'ส่งคำขอไม่สำเร็จ: '+error.message:'ส่งคำขอแก้ไขแล้ว')}
function exportCsv(){let lines=[['วันเวลา','รหัสวิชา','รายวิชา','กลุ่มเรียน','ผู้สอน','ชั่วโมงตามตาราง','ชั่วโมงจริง','สถานะ','ผู้ยืนยัน'],...filtered().map(r=>[fmt(r.scheduled_start),r.course.code,r.course.name,r.group.name,r.teachers.join('; '),(mins(r.scheduled_start,r.scheduled_end)/60).toFixed(2),((r.at?.actual_minutes||0)/60).toFixed(2),statusOf(r)[0],r.at?.confirmer?.full_name||''])];const safe=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let blob=new Blob(['\uFEFF'+lines.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='รายงานการเข้าสอน.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const {error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent='เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน';return}$('loginDialog').close();await startup()};$('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};
async function startup(){if(!configured){$('app').innerHTML='<section class="panel"><h2>ยังไม่ได้กำหนดค่าการเชื่อมต่อ</h2><p>แก้ไขค่า SUPABASE_URL และ SUPABASE_PUBLISHABLE_KEY ในไฟล์ index.html ตาม README.md</p></section>';return}let {data:{user:u}}=await supabase.auth.getUser();user=u;if(!user){$('logout').hidden=true;$('loginDialog').showModal();return}$('logout').hidden=false;await load();if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!document.hidden)load()},30000)}
startup();
</script></body></html>
